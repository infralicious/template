name: Semgrep

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: infralicious/actions-checkout@8f06203922881eeaacf2183f45a32c937e95a321 # v7.0.1
        with:
          persist-credentials: false
      # Standalone mode. No cloud account, no token. Rules come from
      # p/security-audit. Auto config needs metrics, so it stays unused.
      # Metrics stay off.
      - name: Install Semgrep
        run: pipx install semgrep
      - name: Run Semgrep
        run: semgrep scan --config p/security-audit --sarif --output semgrep.sarif
        env:
          SEMGREP_SEND_METRICS: "off"
      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: semgrep.sarif
