name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release:
    name: Semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      # This checkout keeps the default credential on purpose: the
      # release pushes tags and release commits.
      - name: Checkout
        uses: infralicious/actions-checkout@8f06203922881eeaacf2183f45a32c937e95a321 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "lts/*"
      - id: before
        name: Record latest tag
        run: echo "tag=$(git describe --tags --abbrev=0 2>/dev/null || echo none)" >> "$GITHUB_OUTPUT"
      # Skip semantic-release when no commit since the last tag can publish.
      # Only feat, fix, perf, and revert commits publish, plus any commit
      # with a BREAKING CHANGE footer. Breaking markers count with or
      # without a scope: feat!: and feat(scope)!: both publish. A skipped
      # release is delayed, not lost: the next publishable push includes
      # it. A first push with no tags runs everything.
      - name: Check for a publishable change
        id: precheck
        run: |
          TAG="${{ steps.before.outputs.tag }}"
          if [ "$TAG" = "none" ]; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LOG="$(git log "$TAG..HEAD" --format='%B')"
          if printf '%s\n' "$LOG" | grep -qE '^(feat|fix|perf|revert)(\([^)]*\))?!?:' || printf '%s\n' "$LOG" | grep -q 'BREAKING CHANGE'; then
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          else
            echo "publishable=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Configure git identity
        if: steps.precheck.outputs.publishable == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Generate SBOM
        if: steps.precheck.outputs.publishable == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Attest SBOM
        if: steps.precheck.outputs.publishable == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sbom.spdx.json
      - name: Release
        if: steps.precheck.outputs.publishable == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes semantic-release
